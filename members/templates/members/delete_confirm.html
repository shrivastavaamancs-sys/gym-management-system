<!DOCTYPE html>
<html>
<head>
    <title>Delete Member</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f4f7f6; padding: 50px; display: flex; justify-content: center; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 400px; text-align: center; }
        button { background: #e74c3c; color: white; padding: 10px 20px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-right: 10px; }
        button:hover { background: #c0392b; }
        .btn-cancel { background: #95a5a6; text-decoration: none; color: white; padding: 10px 20px; border-radius: 4px; display: inline-block; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Delete Member</h2>
        <p>Kya aap sach mein <b>{{ member.name }}</b> ko delete karna chahte hain?</p>
        <form method="POST">
            {% csrf_token %}
            <button type="submit">Yes, Delete</button>
            <a href="{% url 'member_list' %}" class="btn-cancel">Cancel</a>
        </form>
    </div>
</body>
</html>
