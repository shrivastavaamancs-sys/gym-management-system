<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            margin: 0;
            padding: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 380px;
            text-align: center;
        }
        h2 { color: #2c3e50; margin-bottom: 10px; }
        p { color: #666; font-size: 14px; margin-bottom: 20px; }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            font-size: 18px;
            text-align: center;
            letter-spacing: 4px;
            border: 2px solid #cbd5e0;
            border-radius: 8px;
            box-sizing: border-box;
            margin-bottom: 15px;
            outline: none;
        }
        input:focus { border-color: #3182ce; }
        button {
            width: 100%;
            background-color: #3182ce;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #2b6cb0; }
        .error { color: #e53e3e; font-size: 13px; margin-bottom: 15px; font-weight: 600; }
        .cancel-link { display: block; margin-top: 15px; color: #718096; text-decoration: none; font-size: 14px; }
        .cancel-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🔒 Security Verification</h2>
        <p>Aapke <b>{{ action_type }}</b> action ke liye OTP generate kiya gaya hai. Kripya apna **VS Code Terminal** check karein.</p>
        
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
        
        <form method="POST">
            {% csrf_token %}
            <input type="text" name="otp" placeholder="------" maxlength="6" required autofocus>
            <button type="submit">Verify & Confirm</button>
        </form>
        
        <a href="{% url 'member_list' %}" class="cancel-link">Cancel & Go Back</a>
    </div>
</body>
</html>
